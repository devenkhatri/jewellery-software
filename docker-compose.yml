services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: jewelerp-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-jewellry}
      DB_USERNAME: ${DB_USERNAME:-jewel_user}
      DB_PASSWORD: ${DB_PASSWORD:-jewel_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jewelerp-network

  web:
    image: nginx:alpine
    container_name: jewelerp-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - jewelerp-network

  db:
    image: mysql:8.4
    container_name: jewelerp-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-jewellry}
      MYSQL_USER: ${DB_USERNAME:-jewel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-jewel_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - jewelerp-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - jewelerp-network

  redis:
    image: redis:7-alpine
    container_name: jewelerp-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - jewelerp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jewelerp-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: jewelerp-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - .:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jewelerp-network

networks:
  jewelerp-network:
    driver: bridge

volumes:
  jewelerp-db-data:
    driver: local
  jewelerp-redis-data:
    driver: local
